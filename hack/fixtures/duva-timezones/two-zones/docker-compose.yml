# duva runs on an image with no /usr/share/zoneinfo, so Go cannot resolve a
# zone name like Europe/Copenhagen from the filesystem: TZ was silently
# ignored and every timestamp stayed UTC while the setting looked applied.
# The binary embeds the database instead (time/tzdata).
#
# Two duvas, same instant, zones half a world apart. One alone proves little
# -- it could match by coincidence, or both could be UTC and equal. A
# DIFFERENCE between them can only come from TZ being read.
#
# It cannot be tested as a unit: that would load the zone from the developer's
# own machine, which has zoneinfo, and pass whether or not the import exists.
#
# The image carries no digest: the suite pins it with docker pin before duva
# runs, so the starting state is produced the same way a real stack's is.
#
# Every path is relative to this file, so the fixture needs no variables and
# says the same thing wherever the repo lives.
services:
  app:
    image: localhost:5555/app:1.0.0
    labels:
      duva.include: '^1\.0\.\d+$'
      duva.auto: patch

  # duva watches from inside the stack, as in production: it reads its own
  # container's compose project label to know which project to recreate
  # containers in. Outside a project there is no label and it refuses to guess.
  duva_copenhagen:
    image: duva:integration
    command: serve
    environment:
      DUVA_HOSTNAME: integration
      TZ: Europe/Copenhagen
      # serve announces when it will next check; that line is the timestamp
      # this scenario compares. The schedule never fires.
      DUVA_SCHEDULE: "0 3 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose
      - ./data:/data
      # Only here because the suite's registry is self-signed.
      - ./certs/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
    extra_hosts:
      # The image is localhost:5555/app, and that name has to mean the registry
      # in two places: here, where duva lists tags over HTTPS, and on the host's
      # daemon, where the pull happens. It already does on the host; this makes
      # it so inside the container. A real registry resolves the same
      # everywhere, so neither this nor the certificate mount exists there.
      - localhost:host-gateway

  duva_auckland:
    image: duva:integration
    command: serve
    environment:
      DUVA_HOSTNAME: integration
      TZ: Pacific/Auckland
      # serve announces when it will next check; that line is the timestamp
      # this scenario compares. The schedule never fires.
      DUVA_SCHEDULE: "0 3 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose
      - ./data:/data
      # Only here because the suite's registry is self-signed.
      - ./certs/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
    extra_hosts:
      # The image is localhost:5555/app, and that name has to mean the registry
      # in two places: here, where duva lists tags over HTTPS, and on the host's
      # daemon, where the pull happens. It already does on the host; this makes
      # it so inside the container. A real registry resolves the same
      # everywhere, so neither this nor the certificate mount exists there.
      - localhost:host-gateway
