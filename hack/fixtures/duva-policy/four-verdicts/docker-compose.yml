# Four services on one image, differing only by label, so the same available
# tags produce four different verdicts. The registry holds a newer patch and a
# newer minor of the 1.x line.
#
# Every path is relative to this file, so the fixture needs no variables and
# says the same thing wherever the repo lives.
services:
  # patch available, duva.auto: patch -> applied unattended, never queued
  autopatch:
    image: localhost:5555/app:1.26.0
    labels:
      duva.include: '^1\.26\.\d+$'
      duva.auto: patch

  # minor available, duva.auto: patch -> exceeds the threshold, queued
  exceeds:
    image: localhost:5555/app:1.26.0
    labels:
      duva.include: '^1\.\d+\.\d+$'
      duva.auto: patch

  # patch available, no duva.auto -> defaults to none, queued
  defaultnone:
    image: localhost:5555/app:1.26.0
    labels:
      duva.include: '^1\.26\.\d+$'

  # unpinned: being pinned is the opt-in, so this one is not watched at all
  loose:
    image: localhost:5555/app:1.26.0

  # duva watches from inside the stack, as in production: it reads its own
  # container's compose project label to know which project to recreate
  # containers in. Outside a project there is no label and it refuses to guess.
  duva:
    image: duva:integration
    command: serve
    environment:
      DUVA_HOSTNAME: integration
      # serve is what ships. It checks once at startup, so restarting the
      # container is what triggers a check; this schedule never fires.
      DUVA_SCHEDULE: "0 3 * * *"
    ports:
      # The approval queue, so a test can read what an operator would see.
      - "8098:8080"
    volumes:
      # The socket, because duva applies here: autopatch is recreated.
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose
      - ./data:/data
      # Only here because the suite's registry is self-signed.
      - ./certs/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
    extra_hosts:
      # duva drives the HOST's daemon, so the registry has to be named as that
      # daemon can resolve it: the published port.
      - localhost:host-gateway
