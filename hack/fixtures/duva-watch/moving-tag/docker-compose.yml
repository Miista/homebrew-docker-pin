# A service pinned without a duva.include, so it follows whatever the tag
# points at. duva records a digest baseline silently, and announces only when
# that digest moves.
#
# Every path is relative to this file, so the fixture needs no variables and
# says the same thing wherever the repo lives.
include:
  # The receiver duva announces to. The registry is not here: it is
  # infrastructure the suite runs, like GHCR is in production, rather than
  # part of the world under test.
  - common/ntfy.yml

services:
  app:
    image: localhost:5555/app:latest

  # duva watches from inside the stack, as in production. No docker socket:
  # this scenario is about what duva notices and announces, and it applies
  # nothing -- which is what a service with no duva.auto gets.
  duva:
    image: duva:integration
    command: serve
    environment:
      DUVA_HOSTNAME: integration
      DUVA_SCHEDULE: "0 3 * * *"
      DUVA_NTFY_URL: http://ntfy:8080
      DUVA_NTFY_TOPIC: duva
    volumes:
      - .:/compose
      - ./data:/data
      # Only here because the suite's registry is self-signed.
      - ./certs/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
    extra_hosts:
      # duva reaches the registry through its published port, as the host's
      # daemon does.
      - localhost:host-gateway
