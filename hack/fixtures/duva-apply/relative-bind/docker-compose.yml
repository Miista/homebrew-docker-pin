# The watched service has a RELATIVE bind. duva sees this file at its own
# mount point rather than the host path, so the question is whether ./conf
# still resolves to the host's directory once duva recreates the container.
#
# It does: compose resolves relative paths against the project's recorded
# working_dir, not its own cwd. Tested rather than assumed, because a data
# volume silently pointed at the wrong place loses data quietly.
#
# The image carries no digest: the suite pins it with docker pin before duva
# runs, so the starting state is produced the same way a real stack's is.
#
# Every path is relative to this file, so the fixture needs no variables and
# says the same thing wherever the repo lives.
include:
  # The registry this scenario pulls from. Shared, because it is identical
  # everywhere and copies drift.
  - common/registry.yml

services:
  app:
    image: localhost:5555/app:1.0.0
    volumes:
      - ./conf:/mnt
    labels:
      duva.include: '^1\.0\.\d+$'
      duva.auto: patch

  # duva watches from inside the stack, as in production: it reads its own
  # container's compose project label to know which project to recreate
  # containers in. Outside a project there is no label and it refuses to guess.
  duva:
    image: duva:integration-apply
    command: serve
    environment:
      DUVA_HOSTNAME: integration
      # serve is what ships. It checks once at startup, so restarting the
      # container is what triggers a check; this schedule never fires.
      DUVA_SCHEDULE: "0 3 * * *"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose
      - ./data:/data
      # Only here because the suite's registry is self-signed.
      - ./certs/cert.pem:/etc/ssl/certs/ca-certificates.crt:ro
    extra_hosts:
      # The image is localhost:5555/app, and that name has to mean the registry
      # in two places: here, where duva lists tags over HTTPS, and on the host's
      # daemon, where the pull happens. It already does on the host; this makes
      # it so inside the container. A real registry resolves the same
      # everywhere, so neither this nor the certificate mount exists there.
      - localhost:host-gateway
