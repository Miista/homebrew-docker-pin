# The registry every scenario publishes its test images to.
#
# Included rather than copied into each fixture: it is identical everywhere,
# and copies drift. Included rather than started by shell: a container is a
# container, and the compose file is where a scenario's containers are
# declared.
#
# Published on 5555 because images are named localhost:5555/... -- duva drives
# the host's daemon, which can only resolve names it knows. The certificate is
# generated per run into the scenario's own directory.
services:
  testregistry:
    image: registry:3
    ports:
      - "5555:5000"
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/cert.pem
      REGISTRY_HTTP_TLS_KEY: /certs/key.pem
    volumes:
      # Relative to THIS file, which sits in common/ -- so the certificates,
      # which live at the project root, are one level up.
      - ../certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "-", "https://localhost:5000/v2/"]
      interval: 1s
      timeout: 2s
      retries: 30
