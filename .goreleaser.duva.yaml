# duva's own GoReleaser config, separate from the root .goreleaser.yaml (the
# CLI) and from duva-v4's.
#
# Its own tags (duva-vX.Y.Z, pushed via .github/workflows/duva-release.yml):
# duva versions independently of docker-pin. The workflow strips the prefix
# and passes the bare version as GORELEASER_CURRENT_TAG, since the
# open-source GoReleaser only reads plain semver. Invoked with
# -f .goreleaser.duva.yaml.
#
# One build and one image, where v4 had four of each: watch, queue, updater
# and UI are one process (docs/duva-v5-one-binary.md).
#
# GORELEASER_CURRENT_TAG must be set explicitly by the workflow. Without it,
# GoReleaser resolves "the current tag" via `git describe`, which picks
# arbitrarily among tags on the same commit -- and the CLI's tags can share
# one.
version: 2

builds:
  - id: duva
    dir: duva-v5
    main: ./cmd/duva
    binary: duva
    goos: [linux]
    goarch: [amd64, arm64]
    # Static: the image is Alpine (musl), and a binary that needed a dynamic
    # linker would be relying on musl's looser linking by luck.
    env:
      - CGO_ENABLED=0
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - id: default
    ids: [duva]
    formats: [binary]

dockers_v2:
  - id: duva
    ids: [duva]
    dockerfile: duva-v5/Dockerfile
    platforms: ["linux/amd64", "linux/arm64"]
    images:
      # v3's name, free since v3 was retired. v4's four images keep theirs,
      # so a host still on v4 is untouched until it switches.
      - "ghcr.io/miista/duva"
    tags:
      - "{{ .Version }}"
      - "latest"

# No GitHub release: the image on ghcr.io is the release, and the releases
# page stays the CLI's.
release:
  disable: true

changelog:
  disable: true

checksum:
  disable: true
