name: duva release

# Publishes ghcr.io/miista/duva when a duva-v<X.Y.Z> tag is pushed. It is
# independent of the CLI release (release.yml, cli-v<X.Y.Z> tags): the two
# have their own version numbers, and tagging one does not release the other.
#
# GoReleaser (.goreleaser.duva.yaml) cross-compiles the binary on the runner
# and builds duva-v5/Dockerfile for linux/amd64 and linux/arm64. The
# open-source GoReleaser only accepts a plain semver tag, so this workflow
# strips the prefix (duva-v5.0.0 -> v5.0.0) and hands that to GoReleaser as
# the version.
#
# The GitHub release ("duva vX.Y.Z", on the duva-v tag, no files) is made
# here, not by GoReleaser: its notes are the commit subjects since the
# previous duva-v tag — filtered like the CLI's changelog — and a compare
# link between the two tags. GoReleaser cannot write that one, because the
# only tag it can parse is the bare version, which does not exist in git.
# The image on ghcr.io is the artifact.
#
# A manual run is a dry run: it builds with the version you give and
# publishes nothing.

on:
  push:
    tags:
      - "duva-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Dry run: build with this version, v<X.Y.Z>. Nothing is pushed."
        required: true
        default: "v0.0.0"

permissions:
  contents: read

concurrency:
  group: duva-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release on the duva-v tag
      packages: write # push to ghcr.io with the workflow's own GITHUB_TOKEN; nothing else is granted
    env:
      # Passed through the environment, never interpolated into the script.
      EVENT: ${{ github.event_name }}
      TAG: ${{ github.ref_name }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the release notes need the history back to the previous duva-v tag

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: duva-v5/go.mod
          cache: true

      - name: Version from the tag
        id: version
        run: |
          if [ "$EVENT" = push ]; then
            version="${TAG#duva-}"
            skip="validate"
            publish=true
          else
            version="$INPUT_VERSION"
            skip="validate,publish"
            publish=false
          fi
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not a version. Tag duva duva-vX.Y.Z (for example duva-v5.0.0)."
            exit 1
          fi
          {
            echo "version=$version"
            echo "skip=$skip"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing duva as $version (publish: $publish)"

      # The image's RUN steps run under emulation for the architecture the
      # runner is not.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --skip=validate: GoReleaser would refuse the bare version below,
      # because that tag does not exist in git (the tag is duva-v<X.Y.Z>);
      # the version has just been checked above.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --skip=${{ steps.version.outputs.skip }} -f .goreleaser.duva.yaml
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The notes: every commit since the previous duva-v tag (duva-v4/ and
      # duva-v5/ tags are not that), newest last, minus the noise the CLI's
      # changelog also drops (chore/docs/test/ci prefixes, the formula bump,
      # merges), then the compare link. The first such release lists every
      # commit and has no link. Written to a file: subjects are not
      # interpolated into the script.
      - name: Release notes
        if: steps.version.outputs.publish == 'true'
        id: notes
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'duva-v*' --exclude 'duva-v*/*' "$TAG^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
            else
              echo "## Changes"
            fi
            echo
            git log --reverse --format='- %s (%h)' ${prev:+"$prev.."}"$TAG" \
              | grep -Ev -- '^- (chore|docs|test|ci)(\(.+\))?:' \
              | grep -Ev -- '^- (Brew formula update|Merge[: ])' \
              || echo "- (no user-facing changes)"
            echo
            echo "Pull: \`docker pull ghcr.io/miista/duva:${VERSION#v}\`"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${TAG}"
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "file=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/notes.md"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # On the duva-v tag, titled by product like the CLI's ("cli vX.Y.Z"),
      # no files: the image on ghcr.io is the artifact. A re-run finds the
      # release already there and leaves it.
      - name: GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --title "duva $VERSION" --notes-file "$NOTES" --verify-tag
          fi

      - name: Summary
        run: |
          {
            echo "### duva image"
            echo "- version: \`${{ steps.version.outputs.version }}\`"
            echo "- published: \`${{ steps.version.outputs.publish }}\`"
            if [ "${{ steps.version.outputs.publish }}" = true ]; then
              echo "- pull: \`docker pull ghcr.io/miista/duva:${{ steps.version.outputs.version }}\` (without the leading v)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
