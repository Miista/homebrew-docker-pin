name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish to the apt repo"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apt-repo:
    needs: release
    if: always() && !cancelled() && !failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install reprepro
        run: sudo apt-get update -q && sudo apt-get install -y -q reprepro

      - name: Import GPG signing key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Download release .debs
        run: gh release download "${{ inputs.tag || github.ref_name }}" --pattern '*.deb' --dir /tmp/debs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build apt repository
        run: |
          set -euo pipefail
          mkdir -p site/conf
          cat > site/conf/distributions <<'EOF'
          Origin: docker-pin
          Label: docker-pin
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: apt repository for docker-pin
          SignWith: yes
          EOF
          reprepro --basedir site includedeb stable /tmp/debs/*.deb
          gpg --armor --export > site/docker-pin.asc
          rm -rf site/conf site/db

      # Force-push a fresh orphan commit: gh-pages always holds exactly one
      # release's apt tree, so the branch never accumulates old binaries.
      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name goreleaser-bot
          git config user.email bot@goreleaser.com
          git add -A
          git commit -qm "apt: publish ${{ inputs.tag || github.ref_name }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
