version: 2

builds:
  - id: docker-pin
    main: ./cmd/docker-pin
    binary: docker-pin
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: docker-unpin
    main: ./cmd/docker-unpin
    binary: docker-unpin
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    builds: [docker-pin, docker-unpin]
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      # Generated by `go run ./tools/genman` (the release workflow runs it).
      - man/docker-pin.1.gz
      - man/docker-unpin.1.gz

nfpms:
  - id: docker-pin
    package_name: docker-pin
    ids: [docker-pin, docker-unpin]
    formats: [deb]
    vendor: Miista
    homepage: https://github.com/Miista/homebrew-docker-pin
    maintainer: Miista <miista@users.noreply.github.com>
    description: Docker CLI plugins to pin and upgrade container images by tag and SHA digest
    license: MIT
    # Docker scans this directory for CLI plugins by default on Linux,
    # so no cliPluginsExtraDirs config is needed (unlike the brew install).
    bindir: /usr/libexec/docker/cli-plugins
    recommends:
      - docker-ce | docker.io
    contents:
      - src: man/docker-pin.1.gz
        dst: /usr/share/man/man1/docker-pin.1.gz
      - src: man/docker-unpin.1.gz
        dst: /usr/share/man/man1/docker-unpin.1.gz

checksum:
  name_template: checksums.txt

dockers:
brews:
  - name: docker-pin
    repository:
      owner: Miista
      name: homebrew-docker-pin
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com
    homepage: https://github.com/Miista/homebrew-docker-pin
    description: Docker CLI plugins to pin and upgrade container images by tag and SHA digest
    install: |
      (lib/"docker/cli-plugins").install "docker-pin", "docker-unpin"
      man1.install "man/docker-pin.1.gz", "man/docker-unpin.1.gz"
    caveats: |
      docker-pin is a Docker CLI plugin. To enable it, add the Homebrew
      lib path to Docker's plugin search path in ~/.docker/config.json:

        {
          "cliPluginsExtraDirs": ["#{HOMEBREW_PREFIX}/lib/docker/cli-plugins"]
        }

      If config.json already exists, add just the "cliPluginsExtraDirs" key.
    test: |
      system "#{lib}/docker/cli-plugins/docker-pin", "docker-cli-plugin-metadata"

# The CLI is released on the bare v<X.Y.Z> tag that release.yml makes from the
# cli-v<X.Y.Z> tag you push; duva is released on duva-v<X.Y.Z> tags (and was
# on duva-v4/vX.Y and duva-v5/vX.Y). None of the prefixed tags is a CLI
# release: without this, the changelog could take one of them as "the
# previous release" (GoReleaser picks the nearest reachable tag, whatever its
# name).
git:
  ignore_tags:
    - "cli-*"
    - "duva-*"

# The release says which product it is: this repo also releases duva, under
# duva-v<X.Y.Z> tags, with no GitHub release of its own.
release:
  name_template: "cli {{ .Tag }}"

# Drop what is not a user-facing change from the changelog: chore/docs/test/ci
# commits, the formula bump GoReleaser itself pushes each release, and merge
# commits ('Merge: <title> (#N)' here).
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^Brew formula update"
      - "^Merge[: ]"
